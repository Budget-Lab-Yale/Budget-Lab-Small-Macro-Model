# =============================================================================
# Gate C conventions for the CBO February-2026 LTBO-centered BLSMM baseline
# Public CBO inputs and calibration conventions. Excel fixtures are frozen.
#
# Keys are read by calibration/R/build_calibration_inputs.R. Comments record
# conventions the code implements directly; editing a comment changes nothing.
# =============================================================================

# Vintages (pinned by SHA-256 in calibration/source_manifest.csv):
#   51135 economic projections, February 11, 2026 (20260211)
#   57054 long-term economic projections, February 25, 2026 (20260225)
#   51119 extended-baseline budget workbook, February 11, 2026 (20260211),
#     reposted February 26 to correct Supplemental Table 1 cell M20.
#
# Horizon: FY2026-2035 reuses the canonical baseline's FY paths; FY2036 to the
# requested end year (at most 2056) is LTBO-derived and FY-converted.

# -----------------------------------------------------------------------------
# Gate C #5 -- frequency.  CBO LTBO economic series are CALENDAR YEAR
# ("all years referred to are calendar years", 57054 Contents A6). Budget series
# are already fiscal year. The builder converts U, R10, RF, real GDP, real
# potential GDP, and PI with FY(t) = 0.75*CY(t) + 0.25*CY(t-1)
# (calibration/R/frequency.R). Nominal GDP, RG_base, and the published debt
# rate are fiscal year. xgap is 100*(rgdp_fy/pot_fy - 1) from the FY-converted
# real GDP and real potential GDP.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Gate C #2/#3 -- rates and the R10 split.  Reuse the baseline term-premium
# judgment rather than inventing a new decomposition of published R10:
# TP = tp_0 and MPE10 = R10 - tp_0. The baseline tp_0 path covers 2026-2035.
# -----------------------------------------------------------------------------
rates:
  pistar: 2.0                          # #1: CBO long-run target (NOT SPF's 2.11)
  tp_0:                                # baseline term-premium judgment, carried forward
    terminal: 1.0                      # tp_0 for every extension year
  rfstar_terminal: 1.35                # #2: hold baseline terminal (under full forcing
                                       #   this only moves backed-out residuals, not the path)
  rbar10: "baseline"                   # hold baseline neutral 10-yr anchor
  # Federal funds rate. Detailed forecast: CBO February 11, 2026 economic
  # projections (vintage 20260211). Extension: the LTBO nominal 10-year yield
  # (ltbo_economic, vintage 20260225, "1. Econ Vars_Annual Rates" row 46, read
  # by read_cbo_ltbo_2026.R). Rule: ffr(t) = ffr(t-1) + nominal_r10_ltbo(t) -
  # nominal_r10_ltbo(t-1) for t >= 2037, on calendar-year values, then
  # FY(t) = 0.75*CY(t) + 0.25*CY(t-1). One-time cross-check against
  # Macro-Projections v3/2026031112 (long-run-calibration commit 747e48c),
  # reference only. The manifest hashes pin both workbooks.
  ffr:
    detailed_forecast:
      source_id: cbo_economic
      sheet: "2. Calendar Year"
      year_row: 7
      label: "Federal funds rate"       # row 105, percent, C:P = 2023-2036
      through_year: 2036
    extension_rule: "lag_ffr_plus_change_ltbo_r10"

# -----------------------------------------------------------------------------
# Gate C forcing mask -- SPF-style partial forcing (validated Gate B benchmark).
# Every variable not listed stays structural. Here that is PIE and RG; RG has
# CBO's average rate on debt as a reported cross-check (a different concept).
# -----------------------------------------------------------------------------
forcing_mask:
  forced: [xgap, U, PI, RF, MPE10, TP]

# -----------------------------------------------------------------------------
# Gate C #6 -- residuals are backed out from targets through LTBO coverage (2056).
# -----------------------------------------------------------------------------
output_gap:
  # CBO's extended baseline keeps a small negative output gap (about -0.5)
  # while its unemployment gap is near zero. BLSMM's Okun relation needs both
  # near zero, so the gap decays toward 0 after the detailed CBO window
  # (2035, the last canonical baseline year):
  # xgap(t) = xgap(2035) * decay_residual^((t-2035)/decay_years) for t > 2035.
  decay_years: 5
  decay_residual: 0.05      # ~5% of the end-of-window gap remains after decay_years

# Initial conditions: the simulation starts from the canonical history's
# FY2025 row, the year before the first baseline year.
