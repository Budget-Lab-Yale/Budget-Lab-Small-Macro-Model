name: JS model parity

# Holds js/blsmm-model.js (the browser port used by the interactive at
# interactives.budgetlab.yale.edu/tools/blsmm/) to the R model in model/v1_8/:
#   1. js/model-data.json must match what js/export-data.R writes from data/,
#      parameters.R and the preset files (no hand edits, no stale copy).
#   2. Every column of the JS simulation must match fresh R runs
#      (js/make-fixtures.R) for the baseline, the presets and seeded random
#      scenarios.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: JS model matches R
    runs-on: ubuntu-latest
    env:
      # The project .Rprofile activates renv, which would try to restore the
      # full Shiny lockfile. These scripts need only nleqslv and jsonlite.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("nleqslv", "jsonlite"))'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: model-data.json is current
        run: |
          Rscript js/export-data.R
          # status, not diff: a deleted-then-regenerated file is untracked, which diff ignores.
          if [ -n "$(git status --porcelain -- js/model-data.json)" ]; then
            git status --short -- js/model-data.json
            git --no-pager diff -- js/model-data.json | head -50
            echo "::error::js/model-data.json is stale. Run 'Rscript js/export-data.R' and commit the result."
            exit 1
          fi

      - name: Generate R reference runs
        run: Rscript js/make-fixtures.R

      - name: JS matches R
        run: node --test js/test/*.test.mjs
